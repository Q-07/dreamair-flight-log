<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flight Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; max-width: 700px; margin: 0 auto; }
    h2, h3 { margin-top: 0; }
    label { display: block; margin-top: 0.75rem; font-weight: 500; }
    input, select { width: 100%; padding: 0.5rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 1rem; padding: 0.75rem 1.5rem; background: #007cba; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #005a87; }
    #summaryPanel { border: 2px solid #007cba; border-radius: 8px; padding: 1.5rem; background: #f0f8ff; margin-top: 1rem; }
    #status { margin-top: 1rem; padding: 1rem; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
  <h2>Flight log entry</h2>

  <form id="flightForm">
    <label>Registration
      <select name="registration" required>
        <option value="YL-NLO">YL-NLO</option>
        <option value="F-BPEF">F-BPEF</option>
        <option value="EC-KHL">EC-KHL</option>
      </select>
    </label>

    <label>Date
      <input type="date" id="date" name="date" required>
    </label>

    <label>Departure aerodrome
      <input type="text" id="departure" name="departure" value="LELL" required>
    </label>

    <label>Arrival aerodrome
      <input type="text" id="arrival" name="arrival" value="LELL" required>
    </label>

    <label>Block OFF time
      <input type="time" id="blockOff" name="blockOff" required>
    </label>

    <label>Take-off time
      <input type="time" id="takeOff" name="takeOff" required>
    </label>

    <label>Landing time
      <input type="time" id="landing" name="landing" required>
    </label>

    <label>Block ON time
      <input type="time" id="blockOn" name="blockOn" required>
    </label>

    <label>Number of landings
      <input type="number" name="landings" value="1" min="0" required>
    </label>

    <label>Number of crew
      <input type="number" name="crew" value="2" min="0" required>
    </label>

    <label>PIC name
      <input type="text" name="pic" required>
    </label>

    <label>Student name
      <input type="text" name="student">
    </label>

    <button type="button" id="reviewButton">Review & sign</button>
  </form>

  <div id="summaryPanel" style="display:none;">
    <h3>Review flight</h3>
    <div id="summaryText"></div>
    <div id="timeSummary" style="margin: 1rem 0; padding: 1rem; background: white; border-radius: 4px;"></div>

    <label>Typed signature <span style="color: red;">*</span>
      <input type="text" id="signature" required>
    </label>

    <div style="margin-top: 1.5rem;">
      <button type="button" id="confirmButton">Confirm & save</button>
      <button type="button" id="cancelButton" style="background: #6c757d; margin-left: 0.5rem;">Cancel</button>
    </div>
  </div>

  <div id="status"></div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwgILjuP4urmm1V8cHSzS59MR8XKcbKjYS5rmUrX1W64TnjCbU9OOp_6MyKFmmD94nf/exec';

    const form = document.getElementById('flightForm');
    const status = document.getElementById('status');
    const summaryPanel = document.getElementById('summaryPanel');
    const summaryText = document.getElementById('summaryText');
    const timeSummary = document.getElementById('timeSummary');
    const reviewButton = document.getElementById('reviewButton');
    const confirmButton = document.getElementById('confirmButton');
    const cancelButton = document.getElementById('cancelButton');
    const signatureInput = document.getElementById('signature');

    // Set defaults on page load
    window.addEventListener('load', () => {
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('date').value = today;

      document.getElementById('departure').value = 'LELL';
      document.getElementById('arrival').value = 'LELL';

      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const currentTime = `${hh}:${mm}`;

      document.getElementById('blockOff').value = currentTime;
      document.getElementById('takeOff').value = currentTime;
      document.getElementById('landing').value = currentTime;
      document.getElementById('blockOn').value = currentTime;
    });

    // Time difference calculation (for preview)
    function parseMinutes(t) {
      if (!t) return 0;
      const [h, m] = t.split(':').map(Number);
      return isNaN(h) || isNaN(m) ? 0 : h * 60 + m;
    }

    function diffHHMM(start, end) {
      const s = parseMinutes(start);
      let e = parseMinutes(end);
      if (e < s) e += 24 * 60;
      const diff = e - s;
      const h = Math.floor(diff / 60);
      const m = diff % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    // Review button
    reviewButton.addEventListener('click', () => {
      const formData = new FormData(form);
      
      const data = Object.fromEntries(formData);
      
      const flightTime = diffHHMM(data.blockOff, data.blockOn);
      const maintenanceTime = diffHHMM(data.takeOff, data.landing);

      summaryText.innerHTML = `
        <strong>Date:</strong> ${data.date || 'N/A'}<br>
        <strong>Registration:</strong> ${data.registration || 'N/A'}<br>
        <strong>Route:</strong> ${data.departure || 'N/A'} → ${data.arrival || 'N/A'}<br>
        <strong>Block:</strong> ${data.blockOff || 'N/A'} - ${data.blockOn || 'N/A'}<br>
        <strong>Airborne:</strong> ${data.takeOff || 'N/A'} - ${data.landing || 'N/A'}<br>
        <strong>Landings:</strong> ${data.landings || 'N/A'}, <strong>Crew:</strong> ${data.crew || 'N/A'}<br>
        <strong>PIC:</strong> ${data.pic || 'N/A'}, <strong>Student:</strong> ${data.student || 'N/A'}
      `;

      timeSummary.innerHTML = `
        <strong>Flight time:</strong> ${flightTime}<br>
        <strong>Maintenance time:</strong> ${maintenanceTime}
      `;

      signatureInput.value = '';
      summaryPanel.style.display = 'block';
      summaryPanel.scrollIntoView({ behavior: 'smooth' });
    });

    // Cancel
    cancelButton.addEventListener('click', () => {
      summaryPanel.style.display = 'none';
    });

    // Confirm & Save
    confirmButton.addEventListener('click', () => {
      if (!signatureInput.value.trim()) {
        alert('Please enter your typed signature.');
        return;
      }

      const formData = new FormData(form);
      formData.append('signature', signatureInput.value.trim());

      status.textContent = 'Saving flight...';
      status.className = '';

      fetch(scriptURL, {
        method: 'POST',
        body: formData
      })
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        return response.json();
      })
      .then(result => {
        if (result.result === 'success') {
          status.textContent = `✅ Flight saved! ID: ${result.id} | Flight: ${result.flightTime} | Maint: ${result.maintenanceTime}`;
          status.className = 'success';
          
          // Reset form
          form.reset();
          summaryPanel.style.display = 'none';

          // Restore defaults
          const today = new Date().toISOString().slice(0, 10);
          document.getElementById('date').value = today;
          document.getElementById('departure').value = 'LELL';
          document.getElementById('arrival').value = 'LELL';

          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');
          const currentTime = `${hh}:${mm}`;
          
          document.getElementById('blockOff').value = currentTime;
          document.getElementById('takeOff').value = currentTime;
          document.getElementById('landing').value = currentTime;
          document.getElementById('blockOn').value = currentTime;
        } else {
          throw new Error(result.message || 'Unknown server error');
        }
      })
      .catch(error => {
        console.error('Save error:', error);
        status.textContent = `❌ Error: ${error.message}`;
        status.className = 'error';
      });
    });
  </script>
</body>
</html>
